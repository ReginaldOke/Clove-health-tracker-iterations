<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="data:," />
<title>Clove - Health goals concepts</title>
<style>
  @font-face { font-family: "Acaraje"; font-weight: 400; src: url("assets/fonts/Acaraje-Regular.otf") format("opentype"); }
  @font-face { font-family: "Acaraje"; font-weight: 500; src: url("assets/fonts/Acaraje-Medium.otf") format("opentype"); }
  @font-face { font-family: "Acaraje"; font-weight: 600; src: url("assets/fonts/Acaraje-SemiBold.otf") format("opentype"); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #111;
    color: #fff;
    font-family: "Acaraje", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }


  /* ---- stage: the phones ---- */
  .wrap { height: 100%; display: flex; align-items: flex-start; justify-content: center; padding-top: 16px; }
  .scale { transform: scale(var(--s, 1)); transform-origin: 50% 0; }
  .stage { position: relative; width: 402px; height: 874px; }
  .track { position: absolute; inset: 0; display: flex; gap: 64px; transition: transform 680ms cubic-bezier(0.22, 1, 0.36, 1); }
  .slot {
    position: relative;
    flex: none;
    width: 402px;
    height: 874px;
    border-radius: 46px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 40px 90px rgba(0, 0, 0, 0.55);
    transition: opacity 520ms ease, transform 680ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .slot iframe { width: 402px; height: 874px; border: 0; display: block; background: #fff; }
  .slot:not(.on) { opacity: 0.22; transform: scale(0.92); }
  .slot .cover { position: absolute; inset: 0; cursor: pointer; display: none; }
  .slot:not(.on) .cover { display: block; }

  /* ---- the switcher lives OUTSIDE the phone frame ---- */
  .nav {
    position: fixed;
    top: 50%;
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    border: none;
    background: none;
    cursor: pointer;
    font-family: inherit;
    color: rgba(255, 255, 255, 0.55);
    font-size: 12px;
    transform: translateY(-50%);
  }
  .nav .disc {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.16);
    transition: transform 180ms cubic-bezier(0.22, 1, 0.36, 1), background 180ms ease;
  }
  .nav:hover .disc { transform: scale(1.08); background: rgba(255, 255, 255, 0.16); }
  .nav:active .disc { transform: scale(0.9); }
  .nav .disc img { width: 14px; height: 8px; filter: invert(1); opacity: 0.8; }
  .nav__lbl { display: none; font-size: 12.5px; color: rgba(255, 255, 255, 0.75); white-space: nowrap; text-shadow: 0 1px 10px rgba(0, 0, 0, 0.7); }
  .nav--prev { left: calc(50% - var(--edge, 201px) - 110px); }
  .nav--next { right: calc(50% - var(--edge, 201px) - 110px); }
  .nav--prev .disc img { transform: rotate(90deg); }
  .nav--next .disc img { transform: rotate(-90deg); }
  /* a soft ripple on the next arrow until the first interaction */
  .nav--next.hint .disc { animation: nudge 2.4s ease 1s 2; }
  @keyframes nudge { 0%, 100% { transform: none; } 12% { transform: translateX(7px); } 24% { transform: none; } }
  @keyframes halo { 0% { opacity: 0.8; transform: scale(1); } 45% { opacity: 0; transform: scale(1.75); } 100% { opacity: 0; } }

  /* ---- legend: which concept am I looking at ---- */
  .legend {
    position: fixed;
    left: 50%;
    bottom: 20px;
    width: calc(var(--edge, 201px) * 2);
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 20;
    pointer-events: none;
    text-align: center;
  }
  .legend h2 { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 600; letter-spacing: -0.1px; }
  .legend .letter {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.12);
    font-size: 12px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.85);
  }
  .legend p { font-size: 12.5px; color: rgba(255, 255, 255, 0.45); line-height: 1.5; }

  /* ---- floating prototype switcher: Clove liquid glass, mobile only ---- */
  /* lives inside the scaled stage (the stage IS the screen on mobile),
     so it never depends on position:fixed working under emulators */
  .switcher {
    position: absolute;
    top: calc(10px + env(safe-area-inset-top));
    right: 12px;
    z-index: 50;
    display: none;
    align-items: center;
    gap: 2px;
    padding: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.68);
    -webkit-backdrop-filter: blur(18px) saturate(1.7);
    backdrop-filter: blur(18px) saturate(1.7);
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.9),
      0 8px 16px rgba(15, 18, 21, 0.15);
    animation: sw-in 560ms cubic-bezier(0.22, 1, 0.36, 1) 350ms both;
  }
  @keyframes sw-in { from { opacity: 0; transform: translateY(-14px) scale(0.92); } }
  .sw-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    padding: 0;
    border: none;
    border-radius: 999px;
    background: none;
    cursor: pointer;
    transition: transform 160ms cubic-bezier(0.22, 1, 0.36, 1), background 160ms ease, opacity 200ms ease;
  }
  .sw-btn:active { transform: scale(0.88); background: rgba(15, 18, 21, 0.06); }
  .sw-btn img { width: 12px; height: 7px; opacity: 0.8; }
  .sw-btn--prev img { transform: rotate(90deg); }
  .sw-btn--next img { transform: rotate(-90deg); }
  .sw-btn[disabled] { opacity: 0.22; pointer-events: none; }
  .sw-letter {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 26px;
    padding: 0 10px;
    border-radius: 9px;
    background: rgba(15, 18, 21, 0.08);
    font-size: 13px;
    font-weight: 600;
    color: #0f1215;
    white-space: nowrap;
  }
  .sw-letter.pop { animation: sw-pop 360ms cubic-bezier(0.22, 1.4, 0.36, 1); }
  @keyframes sw-pop { 0% { transform: scale(0.55); opacity: 0.3; } 100% { transform: scale(1); opacity: 1; } }

  /* ---- mobile: the prototype IS the screen, glass switcher floats over it ---- */
  @media (max-width: 760px) {
    .wrap { padding-top: 0; justify-content: flex-start; }
    .scale { transform-origin: 0 0; }
    .track { gap: 0; }
    .slot { border-radius: 0; box-shadow: none; }
    .slot:not(.on) { opacity: 1; transform: none; }
    .nav { display: none; }
    .legend { display: none; }
    .switcher { display: flex; }
  }
  </style>
</head>
<body>

<button class="nav nav--prev" id="navPrev" aria-label="Previous concept"><span class="disc"><img src="assets/icons/chevron-rt.svg" alt="" /></span></button>
<button class="nav nav--next hint" id="navNext" aria-label="Next concept"><span class="nav__lbl">Next prototype</span><span class="disc"><img src="assets/icons/chevron-rt.svg" alt="" /></span></button>


<div class="wrap">
  <div class="scale" id="scale">
    <div class="stage">
      <div class="track" id="track">
        <div class="slot on"><iframe src="concept-1.html" title="Concept 1"></iframe><div class="cover"></div></div>
        <div class="slot"><iframe src="concept-2.html" title="Concept 2"></iframe><div class="cover"></div></div>
        <div class="slot"><iframe src="concept-3.html" title="Concept 3"></iframe><div class="cover"></div></div>
      </div>
      <div class="switcher" id="switcher">
        <button class="sw-btn sw-btn--prev" id="swPrev" aria-label="Previous prototype"><img src="assets/icons/chevron-rt.svg" alt="" /></button>
        <span class="sw-letter" id="swLetter">Option A</span>
        <button class="sw-btn sw-btn--next" id="swNext" aria-label="Next prototype"><img src="assets/icons/chevron-rt.svg" alt="" /></button>
      </div>
    </div>
  </div>
</div>

<footer class="legend">
  <h2><span class="letter" id="cletter">A</span><span id="cname">Option A</span></h2>
  <p id="cdesc">Each goal is a plate wearing its progress ring. Swipe the plate for the next goal, tick dinners off below it.</p>
</footer>

<script>
  (function () {
    var CONCEPTS = [
      { name: "The dressed plate", desc: "Each goal is a plate wearing its progress ring. Swipe the plate for the next goal, tick dinners off below it." },
      { name: "The clean plate", desc: "The calmest dial: the number rests on an empty plate with the cutlery set, week chart front and centre." },
      { name: "Day by day", desc: "The health app week chart, the Clove way: a dinner under every bar, meals rich in your goal standing taller past the dotted goal line." },
    ];
    var i = Math.min(2, Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1));
    var track = document.getElementById("track");
    var slots = track.children;
    var vertical = false;

    /* visualViewport agrees with CSS media queries everywhere (plain
       innerWidth lies under some emulators) and tracks the browser
       chrome collapsing on real phones */
    function vp() {
      var v = window.visualViewport;
      return { w: v ? v.width : window.innerWidth, h: v ? v.height : window.innerHeight };
    }
    function layout() {
      vertical = matchMedia("(max-width: 760px)").matches;
      var v = vp(), s, frameH;
      if (vertical) {
        /* the prototype IS the screen: exact-width scale, height follows
           the real viewport so the app's bottom bars hug the true bottom */
        s = v.w / 402;
        frameH = Math.round(v.h / s);
      } else {
        s = Math.min(1, (v.w - 300) / 402, (v.h - 118) / 874);
        frameH = 874;
      }
      document.querySelector(".stage").style.height = frameH + "px";
      for (var k = 0; k < slots.length; k++) {
        slots[k].style.height = frameH + "px";
        slots[k].querySelector("iframe").style.height = frameH + "px";
      }
      document.getElementById("scale").style.setProperty("--s", s);
      /* park the chevrons just outside the scaled phone edge */
      document.body.style.setProperty("--edge", (201 * s) + "px");
      go(i, true);
    }
    function go(n, instant) {
      var prev = i;
      i = Math.max(0, Math.min(CONCEPTS.length - 1, n));
      /* arriving at a concept replays its entrance: rings draw, bars grow */
      if (!instant && i !== prev) {
        try { slots[i].querySelector("iframe").contentWindow.location.reload(); } catch (e) {}
      }
      var step = 402 + (vertical ? 0 : 64);
      if (instant) track.style.transition = "none";
      track.style.transform = "translateX(" + (-i * step) + "px)";
      if (instant) { void track.offsetWidth; track.style.transition = ""; }
      for (var k = 0; k < slots.length; k++) slots[k].classList.toggle("on", k === i);
      document.getElementById("cletter").textContent = ["A", "B", "C"][i];
      document.getElementById("cname").textContent = "Option " + ["A", "B", "C"][i];
      document.getElementById("cdesc").textContent = CONCEPTS[i].desc;
      document.getElementById("navPrev").style.visibility = i === 0 ? "hidden" : "visible";
      document.getElementById("navNext").style.visibility = i === CONCEPTS.length - 1 ? "hidden" : "visible";
      document.getElementById("swPrev").disabled = i === 0;
      document.getElementById("swNext").disabled = i === CONCEPTS.length - 1;
      var letter = document.getElementById("swLetter");
      letter.textContent = "Option " + ["A", "B", "C"][i];
      if (!instant && i !== prev) {
        letter.classList.remove("pop");
        void letter.offsetWidth;
        letter.classList.add("pop");
      }
      history.replaceState(null, "", "#" + (i + 1));
    }
    function unhint() { document.getElementById("navNext").classList.remove("hint"); }

    document.getElementById("navNext").addEventListener("click", function () { unhint(); go(i + 1); });
    document.getElementById("navPrev").addEventListener("click", function () { unhint(); go(i - 1); });
    document.getElementById("swNext").addEventListener("click", function () { unhint(); go(i + 1); });
    document.getElementById("swPrev").addEventListener("click", function () { unhint(); go(i - 1); });
    Array.prototype.forEach.call(document.querySelectorAll(".cover"), function (c, k) {
      c.addEventListener("click", function () { unhint(); go(Array.prototype.indexOf.call(slots, c.parentNode)); });
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { unhint(); go(i + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { unhint(); go(i - 1); }
    });

    /* swipe on the dark stage (and the dimmed phones) */
    var t0 = null;
    document.addEventListener("touchstart", function (e) {
      t0 = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });
    document.addEventListener("touchend", function (e) {
      if (!t0) return;
      var dx = e.changedTouches[0].clientX - t0.x, dy = e.changedTouches[0].clientY - t0.y;
      t0 = null;
      if (Math.abs(dx) > 60) {
        unhint();
        go(i + (dx < 0 ? 1 : -1));
      }
    }, { passive: true });

    window.addEventListener("resize", layout);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", layout);
    layout();
  })();
</script>
</body>
</html>
