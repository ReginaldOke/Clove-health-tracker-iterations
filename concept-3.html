<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>Clove - Health goals, concept 3</title>
<link rel="stylesheet" href="base.css" />
<link rel="stylesheet" href="memory.css" />
<link rel="stylesheet" href="goals.css" />
<link rel="stylesheet" href="goals2.css" />
<link rel="stylesheet" href="concepts.css" />
</head>
<body class="goals goals2 b3 c1">
<div class="phone">

  <nav class="gl-nav"></nav>

  <main class="gl-body" id="glBody">
    <div class="gl-title-row">
      <h1 class="gl-title">Health goals</h1>
    </div>

    <!-- < Iron goal > : the chevrons walk through the tracked goals -->
    <div class="b3-switch">
      <button class="b3-chev" id="b3Prev" aria-label="Previous goal"><img src="assets/icons/chevron-rt.svg" alt="" style="transform:rotate(90deg)" /></button>
      <h2 id="b3Title">Iron goal</h2>
      <button class="b3-chev" id="b3Next" aria-label="Next goal"><img src="assets/icons/chevron-rt.svg" alt="" style="transform:rotate(-90deg)" /></button>
    </div>

    <div class="b3-body" id="b3Body">

      <!-- the headline stat -->
      <div class="b3-stat">
        <p class="b3-eyebrow">Daily average</p>
        <p class="b3-num"><b id="b3Avg">0</b><span id="b3Unit">mg iron</span></p>
        <p class="b3-range">This week · 20 to 26 Aug</p>
      </div>

      <!-- the week, one bar and one plate per day -->
      <div class="b3-chart" id="b3Chart">
        <div class="b3-lines" id="b3Lines"></div>
        <div class="b3-cols" id="b3Cols"></div>
      </div>

      <!-- the five dinners that get you there -->
      <section class="g2-goal">
        <p class="g2-goalline" id="g2GoalLine">Goal: Eat 5 iron-rich dinners</p>
        <div class="g2-meals" id="g2Meals"></div>
      </section>

    </div>

    <div class="gl-plan" id="glPlanWrap">
      <button class="ai-card" id="glPlan">
        <span class="ai-card__clove"><span class="mark"><img class="logo" src="assets/icons/clove-white.svg" alt="" /><img class="spark" src="assets/icons/clove-sparkle.svg" alt="" /></span></span>
        <span class="ai-card__text">
          <span class="t" id="glPlanT">Plan meals to hit your iron goal</span>
          <span class="s" id="glPlanS">Health goal: Iron</span>
        </span>
      </button>
    </div>

  </main>

  <!-- recipe picker (CardRecipe, Figma 28275:52775) -->
  <div class="gl-sheet g2-recipes" id="g2Modal" hidden>
    <div class="gl-sheet__scrim" id="g2ModalScrim"></div>
    <div class="gl-sheet__card">
      <div class="gl-sheet__grab"></div>
      <h2 class="gl-sheet__h" id="g2ModalH">Iron-rich dinners</h2>
      <p class="gl-sheet__s" id="g2ModalS">Tap a dinner to add it to your week.</p>
      <div class="g2-rgrid" id="g2Rgrid"></div>
    </div>
  </div>

  <!-- "What are you working on?" -->
  <div class="gl-sheet" id="glSheet" hidden>
    <div class="gl-sheet__scrim" id="glScrim"></div>
    <div class="gl-sheet__card">
      <div class="gl-sheet__grab"></div>
      <h2 class="gl-sheet__h">What are you working on?</h2>
      <p class="gl-sheet__s">Clove shapes every suggestion around this.</p>
      <div class="gl-opts" id="glOpts"></div>
    </div>
  </div>
</div>

<script src="app-lite.js"></script>
<script src="memory.js"></script>
<script src="goals.js"></script>
<script src="plates.js"></script>
<script src="tracker.js"></script>
<script>
  (function () {
    var T = Tracker, TOTAL = T.TOTAL;
    var R = "assets/img/recipes/";

    /* the goal accent, softened + solid, per ring colour token */
    var TONE = {
      "var(--eggplant-300)": { soft: "var(--eggplant-100)", solid: "var(--eggplant-300)" },
      "var(--kale-300)": { soft: "var(--kale-100)", solid: "var(--kale-300)" },
      "var(--paprika-300)": { soft: "var(--paprika-100)", solid: "var(--paprika-300)" },
    };

    /* the chart mirrors the goal section: the goal-rich bars ARE the five
       dinners below, in the same order (slots fill chart positions M, T, F);
       two everyday meals stay put, the rest are nights off */
    var RICH_POS = [0, 3, 4];
    var CHART = {
      Iron: {
        unit: "mg", unitLabel: "mg iron", goal: 8, yMax: 12, richVals: [9.2, 8.4, 8.8],
        others: [{ pos: 1, img: R + "creamy-pasta.webp", v: 2.1 }, { pos: 5, img: R + "greek-salad.webp", v: 1.8 }],
      },
      Protein: {
        unit: "g", unitLabel: "g protein", goal: 40, yMax: 60, richVals: [52, 46, 55],
        others: [{ pos: 1, img: R + "greek-salad.webp", v: 14 }, { pos: 5, img: R + "creamy-pasta.webp", v: 18 }],
      },
      Fibre: {
        unit: "g", unitLabel: "g fibre", goal: 12, yMax: 18, richVals: [13.5, 12.8, 14.2],
        others: [{ pos: 1, img: R + "cucumber-salad.webp", v: 3.2 }, { pos: 5, img: R + "baked-pasta.webp", v: 5.1 }],
      },
    };
    function chartFor(s) {
      if (CHART[s.label]) return CHART[s.label];
      var x = T.EXTRAS[s.label];
      if (x) return { unit: x.unit, unitLabel: x.chart.unitLabel, goal: x.chart.goal, yMax: x.chart.yMax, richVals: x.chart.richVals, others: [] };
      return CHART.Iron;
    }
    function daysFor(s, c) {
      var days = [null, null, null, null, null, null, null];
      c.others.forEach(function (o) { days[o.pos] = { img: o.img, v: o.v }; });
      T.slotsFor(s.label).filter(Boolean).slice(0, 3).forEach(function (m, k) {
        days[RICH_POS[k]] = { img: m.img, v: c.richVals[k], rich: true };
      });
      return days;
    }
    var LETTERS = ["M", "T", "W", "T", "F", "S", "S"], TODAY = 3;
    function fmt(n) { return (Math.round(n * 10) / 10).toLocaleString(); }

    /* the goal the chevrons have walked to */
    var focus = sessionStorage.getItem("b3Focus") || "Iron";
    function slideFor(label) {
      var all = T.slides();
      for (var i = 0; i < all.length; i++) if (all[i].label === label) return all[i];
      focus = all[0].label;
      return all[0];
    }
    T.cur = function () { return slideFor(focus); };

    /* ---- the chart ---- */
    function renderChart() {
      var s = T.cur(), c = chartFor(s);
      var days = daysFor(s, c);
      var tone = TONE[s.color] || TONE["var(--eggplant-300)"];
      document.getElementById("b3Title").textContent = s.label + " goal";
      /* stat: the average over the days you cooked */
      var cooked = days.filter(Boolean);
      var avg = cooked.length ? cooked.reduce(function (a, d) { return a + d.v; }, 0) / cooked.length : 0;
      document.getElementById("b3Avg").textContent = fmt(avg);
      document.getElementById("b3Unit").textContent = c.unitLabel;
      /* gridlines at max and midway, the goal as a dotted colour line */
      var H = 190;
      function yTop(v) { return (1 - v / c.yMax) * H; }
      document.getElementById("b3Lines").innerHTML =
        '<div class="b3-line" style="top:0"><span class="b3-line__lbl">' + fmt(c.yMax) + "</span></div>" +
        '<div class="b3-line" style="top:' + yTop(c.yMax / 2).toFixed(1) + 'px"><span class="b3-line__lbl">' + fmt(c.yMax / 2) + "</span></div>" +
        '<div class="b3-line b3-line--base" style="top:' + H + 'px"><span class="b3-line__lbl">0</span></div>' +
        '<div class="b3-goal" style="top:' + yTop(c.goal).toFixed(1) + "px;color:" + tone.solid + '"><span class="b3-goal__lbl">Goal ' + fmt(c.goal) + c.unit + "</span></div>";
      /* one column per day: bar, plate, letter */
      document.getElementById("b3Cols").innerHTML = days.map(function (d, i) {
        var bar = "", thumb;
        if (d) {
          bar = '<div class="b3-bar' + (d.rich ? " b3-bar--rich" : "") + '" style="--d:' + (i * 60) + "ms;height:" + ((d.v / c.yMax) * 100).toFixed(1) + "%;--tone:" + tone.solid + ";--tone-soft:" + tone.soft + '"></div>';
          thumb = '<span class="b3-thumb' + (d.rich ? " b3-thumb--rich" : "") + '" style="--d:' + (120 + i * 60) + "ms;--tone:" + tone.solid + '"><img src="' + d.img + '" alt="" /></span>';
        } else {
          thumb = '<span class="b3-thumb b3-thumb--empty"></span>';
        }
        return '<div class="b3-cell"><div class="b3-barwrap">' + bar + "</div>" + thumb +
          '<span class="b3-day' + (i === TODAY ? " today" : "") + '">' + LETTERS[i] + "</span></div>";
      }).join("");
    }

    /* ---- the five dinners (same component as concept A) ---- */
    function renderMeals(popIdx) {
      var s = T.cur();
      document.getElementById("g2GoalLine").textContent = "Goal: Eat " + TOTAL + " " + T.metaFor(s.label).flavor + " dinners";
      document.getElementById("g2Meals").innerHTML = T.slotsFor(s.label).map(function (m, i) {
        if (!m) return '<button class="g2-meal g2-meal--empty" data-i="' + i + '" aria-label="Add a dinner"></button>';
        return '<button class="g2-meal' + (m.done ? " done" : " g2-meal--planned") + (i === popIdx ? " g2-meal--in" : "") + '" data-i="' + i + '" style="--tone:' + T.cur().color + '" aria-label="' + m.t + '">' +
          '<img src="' + m.img + '" alt="" />' +
          (m.done
            ? '<span class="g2-meal__badge" style="background:' + T.cur().color + '"><img src="assets/icons/check-sm.svg" alt="" /></span>'
            : '<span class="g2-meal__badge cal"><img src="assets/icons/cal-24-dark.svg" alt="" /></span>') +
          "</button>";
      }).join("");
    }
    document.getElementById("g2Meals").addEventListener("click", function (e) {
      var btn = e.target.closest(".g2-meal");
      if (!btn) return;
      var i = Number(btn.dataset.i);
      var slots = T.slotsFor(T.cur().label);
      if (!slots[i]) { T.openModal(); return; }
      slots[i].done = !slots[i].done;
      T.saveState();
      renderMeals(-1);
      if (slots[i].done && T.maybeCelebrate(T.cur().label)) {
        var chart = document.getElementById("b3Chart");
        chart.classList.remove("celebrate"); void chart.offsetWidth;
        chart.classList.add("celebrate");
      }
    });

    /* ---- goal switching: < > with a soft crossfade ---- */
    function step(dir) {
      var all = T.slides();
      var idx = 0;
      for (var i = 0; i < all.length; i++) if (all[i].label === focus) idx = i;
      focus = all[(idx + dir + all.length) % all.length].label;
      sessionStorage.setItem("b3Focus", focus);
      var body = document.getElementById("b3Body");
      body.classList.add("b3-body--fade");
      clearTimeout(body._t);
      body._t = setTimeout(function () {
        renderChart();
        renderMeals(-1);
        renderNudge(false);
        body.classList.remove("b3-body--fade");
      }, 150);
    }
    document.getElementById("b3Prev").addEventListener("click", function () { step(-1); });
    document.getElementById("b3Next").addEventListener("click", function () { step(1); });

    function renderNudge(animate) {
      document.getElementById("glPlanT").textContent = "Plan meals to hit your " + focus.toLowerCase() + " goal";
      document.getElementById("glPlanS").textContent = "Health goal: " + focus;
      var planCard = document.querySelector("#glPlanWrap .ai-card");
      clearTimeout(planCard._t);
      if (animate) {
        planCard.classList.remove("ai-card--reveal");
        planCard.classList.add("ai-card--wait");
        planCard._t = setTimeout(function () {
          planCard.classList.remove("ai-card--wait");
          planCard.classList.add("ai-card--reveal");
        }, 1400);
      } else {
        planCard.classList.remove("ai-card--wait");
        planCard.classList.add("ai-card--reveal");
      }
    }

    function render(animate) {
      renderChart();
      renderMeals(-1);
      renderNudge(animate);
    }

    T.onAdd = function (free) { renderMeals(free); renderChart(); };
    T.onMealChange = function (kind) { renderMeals(-1); if (kind === "remove") renderChart(); };
    T.onGoalAdded = function (label) {
      focus = label;
      sessionStorage.setItem("b3Focus", focus);
      var body = document.getElementById("b3Body");
      body.classList.add("b3-body--fade");
      setTimeout(function () {
        renderChart();
        renderMeals(-1);
        renderNudge(false);
        body.classList.remove("b3-body--fade");
      }, 150);
    };
    T.bindLongPress(document.getElementById("g2Meals"), function (i) { T.openMealSheet(i); });
    T.bindSheet(function () { render(false); });
    T.bindNudge();
    render(true);
  })();
</script>
</body>
</html>
